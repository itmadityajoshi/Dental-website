<svg width="1400" height="1000" viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b4a5a"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a94a3"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0a1220" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="#f4f6f9"/>

  <!-- Title block -->
  <text x="60" y="55" font-size="28" font-weight="700" fill="#141b2d">Dental Appointment Booking System</text>
  <text x="60" y="82" font-size="15" fill="#5b6778">System Architecture &#8212; React SPA · Django REST Framework · PostgreSQL</text>
  <line x1="60" y1="100" x2="1340" y2="100" stroke="#d3d9e0" stroke-width="1.5"/>

  <!-- ============ CLIENT LAYER ============ -->
  <rect x="60" y="130" width="1280" height="180" rx="8" fill="#eef2fa" stroke="#c3cee0" stroke-width="1.5"/>
  <text x="85" y="158" font-size="13" font-weight="700" fill="#3b5a8a" letter-spacing="1.5">CLIENT LAYER</text>

  <!-- React SPA container -->
  <g filter="url(#shadow)">
    <rect x="100" y="175" width="1200" height="115" rx="6" fill="#ffffff" stroke="#c3cee0" stroke-width="1.5"/>
  </g>
  <text x="125" y="200" font-size="15" font-weight="700" fill="#141b2d">React Single-Page Application</text>
  <text x="125" y="219" font-size="12" fill="#5b6778">Vite · React Router · Axios · Tailwind CSS</text>

  <!-- Three page groups -->
  <g filter="url(#shadow)">
    <rect x="125" y="235" width="360" height="42" rx="5" fill="#eaf1fb" stroke="#a9c2e8" stroke-width="1"/>
  </g>
  <text x="145" y="260" font-size="13" font-weight="600" fill="#1e3a5f">Public Pages</text>
  <text x="255" y="260" font-size="11.5" fill="#5b6778">Login &#183; Signup &#183; Browse Dentists</text>

  <g filter="url(#shadow)">
    <rect x="505" y="235" width="360" height="42" rx="5" fill="#eaf7f0" stroke="#9ed4b3" stroke-width="1"/>
  </g>
  <text x="525" y="260" font-size="13" font-weight="600" fill="#1e5f3a">Patient Pages</text>
  <text x="620" y="260" font-size="11.5" fill="#5b6778">Book &#183; View &#183; Cancel Appointments</text>

  <g filter="url(#shadow)">
    <rect x="885" y="235" width="360" height="42" rx="5" fill="#fbeeea" stroke="#e0ab97" stroke-width="1"/>
  </g>
  <text x="905" y="260" font-size="13" font-weight="600" fill="#7a3a20">Staff Pages</text>
  <text x="990" y="260" font-size="11.5" fill="#5b6778">Dashboard &#183; Manage Bookings</text>

  <!-- CORS boundary label -->
  <line x1="700" y1="310" x2="700" y2="345" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <rect x="595" y="313" width="210" height="24" rx="4" fill="#fff3d6" stroke="#e0c476" stroke-width="1"/>
  <text x="700" y="329" font-size="11" fill="#7a5c10" text-anchor="middle" font-weight="600">HTTPS &#183; CORS-restricted origin</text>

  <!-- ============ APPLICATION LAYER ============ -->
  <rect x="60" y="360" width="1280" height="330" rx="8" fill="#eef2fa" stroke="#c3cee0" stroke-width="1.5"/>
  <text x="85" y="388" font-size="13" font-weight="700" fill="#3b5a8a" letter-spacing="1.5">APPLICATION LAYER &#8212; Django REST Framework</text>

  <!-- API Gateway strip -->
  <g filter="url(#shadow)">
    <rect x="100" y="405" width="1200" height="50" rx="6" fill="#141b2d"/>
  </g>
  <text x="700" y="435" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">REST API &#8212; Token Authentication &#183; Rate Limiting &#183; Permission Boundaries</text>

  <!-- Four app modules -->
  <g filter="url(#shadow)">
    <rect x="100" y="480" width="280" height="185" rx="6" fill="#ffffff" stroke="#c3cee0" stroke-width="1.5"/>
  </g>
  <rect x="100" y="480" width="280" height="34" rx="6" fill="#3b5a8a"/>
  <text x="240" y="502" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">accounts</text>
  <text x="120" y="534" font-size="11.5" fill="#3b4a5a">&#8226; Custom email-based User model</text>
  <text x="120" y="554" font-size="11.5" fill="#3b4a5a">&#8226; Signup / Login</text>
  <text x="120" y="574" font-size="11.5" fill="#3b4a5a">&#8226; Password reset flow</text>
  <text x="120" y="594" font-size="11.5" fill="#3b4a5a">&#8226; Expiring token auth</text>
  <text x="120" y="614" font-size="11.5" fill="#3b4a5a">&#8226; Login rate throttling</text>

  <g filter="url(#shadow)">
    <rect x="400" y="480" width="280" height="185" rx="6" fill="#ffffff" stroke="#c3cee0" stroke-width="1.5"/>
  </g>
  <rect x="400" y="480" width="280" height="34" rx="6" fill="#2e7d55"/>
  <text x="540" y="502" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">clinic</text>
  <text x="420" y="534" font-size="11.5" fill="#3b4a5a">&#8226; Dentist &amp; Service models</text>
  <text x="420" y="554" font-size="11.5" fill="#3b4a5a">&#8226; Full CRUD (staff-only writes)</text>
  <text x="420" y="574" font-size="11.5" fill="#3b4a5a">&#8226; Working-hours scheduling</text>
  <text x="420" y="594" font-size="11.5" fill="#3b4a5a">&#8226; Available-slots calculation</text>

  <g filter="url(#shadow)">
    <rect x="700" y="480" width="280" height="185" rx="6" fill="#ffffff" stroke="#c3cee0" stroke-width="1.5"/>
  </g>
  <rect x="700" y="480" width="280" height="34" rx="6" fill="#a05a2c"/>
  <text x="840" y="502" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">appointments</text>
  <text x="720" y="534" font-size="11.5" fill="#3b4a5a">&#8226; Appointment booking &amp; cancel</text>
  <text x="720" y="554" font-size="11.5" fill="#3b4a5a">&#8226; Past-date validation</text>
  <text x="720" y="574" font-size="11.5" fill="#3b4a5a">&#8226; Double-booking prevention</text>
  <text x="720" y="594" font-size="11.5" fill="#3b4a5a">&#8226; Nested dentist/service data</text>
  <text x="720" y="614" font-size="11.5" fill="#3b4a5a">&#8226; Ownership-based permissions</text>

  <g filter="url(#shadow)">
    <rect x="1000" y="480" width="280" height="185" rx="6" fill="#ffffff" stroke="#c3cee0" stroke-width="1.5"/>
  </g>
  <rect x="1000" y="480" width="280" height="34" rx="6" fill="#8a3b6a"/>
  <text x="1140" y="502" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">dashboard</text>
  <text x="1020" y="534" font-size="11.5" fill="#3b4a5a">&#8226; Staff-only appointment list</text>
  <text x="1020" y="554" font-size="11.5" fill="#3b4a5a">&#8226; Status updates (confirm/</text>
  <text x="1020" y="572" font-size="11.5" fill="#3b4a5a">&#160;&#160;cancel/complete)</text>
  <text x="1020" y="592" font-size="11.5" fill="#3b4a5a">&#8226; IsAdminUser permission</text>

  <!-- ============ DATA + EXTERNAL LAYER ============ -->
  <rect x="60" y="710" width="1280" height="160" rx="8" fill="#eef2fa" stroke="#c3cee0" stroke-width="1.5"/>
  <text x="85" y="738" font-size="13" font-weight="700" fill="#3b5a8a" letter-spacing="1.5">DATA &amp; EXTERNAL SERVICES</text>

  <g filter="url(#shadow)">
    <rect x="100" y="755" width="560" height="90" rx="6" fill="#ffffff" stroke="#c3cee0" stroke-width="1.5"/>
  </g>
  <text x="380" y="787" font-size="15" font-weight="700" fill="#141b2d" text-anchor="middle">PostgreSQL</text>
  <text x="380" y="808" font-size="11.5" fill="#5b6778" text-anchor="middle">Users &#183; Dentists &#183; Services &#183; Appointments &#183; Tokens</text>
  <text x="380" y="826" font-size="10.5" fill="#8a94a3" text-anchor="middle">Credentials via environment variables (.env)</text>

  <g filter="url(#shadow)">
    <rect x="740" y="755" width="560" height="90" rx="6" fill="#ffffff" stroke="#c3cee0" stroke-width="1.5"/>
  </g>
  <text x="1020" y="787" font-size="15" font-weight="700" fill="#141b2d" text-anchor="middle">Email Service (SMTP)</text>
  <text x="1020" y="808" font-size="11.5" fill="#5b6778" text-anchor="middle">Booking confirmations &#183; Password reset links</text>
  <text x="1020" y="826" font-size="10.5" fill="#8a94a3" text-anchor="middle">Console backend (dev) &#8594; SMTP (production)</text>

  <!-- Connecting arrows -->
  <line x1="700" y1="690" x2="700" y2="705" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)" style="display:none"/>

  <line x1="380" y1="690" x2="380" y2="750" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1020" y1="690" x2="1020" y2="750" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="1090" y="910" width="250" height="70" rx="6" fill="#ffffff" stroke="#c3cee0" stroke-width="1"/>
  <text x="1105" y="930" font-size="11" font-weight="700" fill="#141b2d">LEGEND</text>
  <line x1="1105" y1="945" x2="1130" y2="945" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1138" y="949" font-size="10.5" fill="#3b4a5a">Data flow</text>
  <line x1="1105" y1="963" x2="1130" y2="963" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDashed)"/>
  <text x="1138" y="967" font-size="10.5" fill="#3b4a5a">Network boundary</text>

  <text x="60" y="960" font-size="10.5" fill="#8a94a3">Prepared as part of a self-directed learning project &#8226; Django + React full-stack build</text>

</svg>
